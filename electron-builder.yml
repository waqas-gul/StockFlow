appId: com.waqas.stockflow
productName: StockFlow
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!components.json'
  - '!coverage/**'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!development-docs-workthorgh/**'
asarUnpack:
  - resources/**
win:
  target:
    - nsis
  executableName: StockFlow
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Never remove %APPDATA%\StockFlow (the user's data) on uninstall or upgrade.
  deleteAppDataOnUninstall: false
# Native modules are rebuilt for Electron by the `postinstall` script (electron-builder install-app-deps).
npmRebuild: false
