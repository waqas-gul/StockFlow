appId: com.waqas.stockflow
productName: StockFlow
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!components.json'
  - '!coverage/**'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!development-docs-workthorgh/**'
  - '!scripts/**'
  # better-sqlite3 needs only lib/ and build/Release/better_sqlite3.node at runtime; these are its C sources.
  - '!node_modules/better-sqlite3/{deps,src}/**'
  # zod's TypeScript sources and their tests; the app loads its compiled .cjs files.
  - '!node_modules/zod/src/**'
asarUnpack:
  - resources/**
# V1 has no auto-updater: updates are a new installer run by hand. Without this, electron-builder writes update
# metadata (resourcespp-update.yml, latest.yml) pointing at the Git remote.
publish: null
win:
  target:
    - nsis
  executableName: StockFlow
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  # A normal assisted installer (Next / Install / Finish) that installs for all users under Program Files. The data
  # is per Windows user under %APPDATA%\StockFlow, never in the install folder.
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Never remove %APPDATA%\StockFlow (the user's data) on uninstall or upgrade.
  deleteAppDataOnUninstall: false
# better-sqlite3 gets its Electron build from the `postinstall` script (electron-builder install-app-deps),
# which downloads the prebuilt binary for Electron's ABI. Nothing is compiled, so no C++ build tools are needed.
npmRebuild: false
